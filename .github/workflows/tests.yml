# Lance toute la suite de tests à chaque pull request et à chaque push sur main.
name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Tous les tests (application, serveur Apps Script, serveur hébergé)
        run: node --test test/*.test.js
